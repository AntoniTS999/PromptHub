{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <h1>Log in</h1>
  {% if form.errors %}
  <p style="color: red">Invalid credentials</p>
  {% endif %}
  <form action="{% url 'login' %}" method="POST">
  {% csrf_token %}
  {{ form|crispy }}
    <input class="btn btn-primary" type="submit" value="Log in">

     <input type="hidden" name="next" value="{{ request.GET.next }}">

  </form>
{% endblock %}
