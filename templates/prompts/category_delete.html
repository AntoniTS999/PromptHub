{% extends 'base.html' %}

{% block content %}
  <h1>Delete category</h1>
  <p>Are you sure you want to delete category: {{ category.name }}?</p>
  <p><i>It couldn't be recovered!</i></p>
  <form action="" method="post">
  {% csrf_token %}
    <input class="btn btn-danger" type="submit" value="Yes, delete">
    {% url 'prompts:category-detail' as category %}
    <a class="btn btn-success" href="{{ next|default:category }}">Cancel</a>
  </form>
{% endblock %}
