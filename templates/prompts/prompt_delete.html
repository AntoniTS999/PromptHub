{% extends  "base.html" %}

{% block content %}
  <p style="color: crimson"><i>Are you sure you want to delete prompt?</i></p>
  <p>It will be deleted permanently</p>
  <form action="" method="post" novalidate>
  {% csrf_token %}
    <input class="btn btn-danger" type="Submit" value="Yes, delete">
    {% url 'prompts:prompt-detail' pk=prompt.id as prompt %}
    <a class="btn btn-success" href="{{ next|default:prompt }}">Cancel</a>
  </form>
{% endblock %}
