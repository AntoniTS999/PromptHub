{% extends  "base.html" %}

{% block content %}
  <p style="color: crimson"><i>You are going to delete your comment</i></p>
  <p>It will be deleted permanently</p>
  <form action="" method="post" novalidate>
  {% csrf_token %}
    <input class="btn btn-dark btn-sm" type="Submit" value="Yes, delete">
    {% url 'prompts:prompt-detail' pk=comment.prompt.id as prompt %}
    <a class="btn btn-outline-dark btn-sm" href="{{ next|default:prompt }}">Cancel</a>
  </form>
{% endblock %}
